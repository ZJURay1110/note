          - 基础入门 (上): python/basic/02_basics_part1.md
          - 表达式: python/basic/03_expressions.md
          - 内存机制: python/basic/04_memory.md
          - 数据类型: python/basic/05_data_types.md
          - 数字: python/basic/06_numbers.md
          - 计算: python/basic/07_calculations.md
          - 布尔类型: python/basic/08_booleans.md
          - 字符串: python/basic/09_strings.md
          - 表达式进阶: python/basic/10_expressions_advanced.md
