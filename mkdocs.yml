# 1. 基本信息
site_name: GIS | CodingNote
site_description: 一些coding note
site_author: Lucas
site_url: https://ZJURay1110.github.io/note/
edit_uri: edit/main/docs/

# 2. 仓库链接（右上角会显示 GitHub 图标）
repo_name: note
repo_url: https://ZJURay1110.github.io/note/

# 3. 主题配置
theme:
  name: material
  language: zh
  favicon: assets/favicon.png
  logo: assets/avatar.jpg
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css

# 4. 导航栏配置
nav:
